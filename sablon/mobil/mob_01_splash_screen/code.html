<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }

    @keyframes pulse-dot-1 {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes pulse-dot-2 {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes pulse-dot-3 {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .anim-dot-1 { animation: pulse-dot-1 1.4s infinite ease-in-out; }
    .anim-dot-2 { animation: pulse-dot-2 1.4s infinite ease-in-out 0.2s; }
    .anim-dot-3 { animation: pulse-dot-3 1.4s infinite ease-in-out 0.4s; }

    /* Ambient organic glow rings */
    @keyframes subtle-breath {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.06); opacity: 0.95; }
    }
    .anim-glow {
      animation: subtle-breath 4s infinite ease-in-out;
